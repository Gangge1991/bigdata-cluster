version: '3'

services:
  kafka1:
    image: apache/kafka:3.7.0
    hostname: kafka1
    container_name: kafka1
    networks:
      - bigdata
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 使用固定的 Cluster ID (UUID)
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka1_data:/var/lib/kafka/data

  kafka2:
    image: apache/kafka:3.7.0
    hostname: kafka2
    container_name: kafka2
    networks:
      - bigdata
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka2_data:/var/lib/kafka/data

  kafka3:
    image: apache/kafka:3.7.0
    hostname: kafka3
    container_name: kafka3
    networks:
      - bigdata
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka3_data:/var/lib/kafka/data

  doris-fe:
    image: apache/doris:2.1.9-fe-x86_64
    hostname: doris-fe
    container_name: doris-fe
    networks:
      - bigdata
    ports:
      - '8030:8030'
      - '9030:9030'
    environment:
      - FE_SERVERS=fe1:doris-fe:9010
      - FE_ID=1
    volumes:
      - doris_fe_meta:/opt/apache-doris/fe/doris-meta
      - doris_fe_log:/opt/apache-doris/fe/log

  doris-be1:
    image: apache/doris:2.1.9-be-x86_64
    hostname: doris-be1
    container_name: doris-be1
    networks:
      - bigdata
    depends_on:
      - doris-fe
    ports:
      - '8040:8040'
    environment:
      - FE_SERVERS=fe1:doris-fe:9010
      - BE_ADDR=doris-be1:9050
    volumes:
      - doris_be1_storage:/opt/apache-doris/be/storage
      - doris_be1_log:/opt/apache-doris/be/log

  doris-be2:
    image: apache/doris:2.1.9-be-x86_64
    hostname: doris-be2
    container_name: doris-be2
    networks:
      - bigdata
    depends_on:
      - doris-fe
    ports:
      - '8041:8040'
    environment:
      - FE_SERVERS=fe1:doris-fe:9010
      - BE_ADDR=doris-be2:9050
    volumes:
      - doris_be2_storage:/opt/apache-doris/be/storage
      - doris_be2_log:/opt/apache-doris/be/log

  doris-be3:
    image: apache/doris:2.1.9-be-x86_64
    hostname: doris-be3
    container_name: doris-be3
    networks:
      - bigdata
    depends_on:
      - doris-fe
    ports:
      - '8042:8040'
    environment:
      - FE_SERVERS=fe1:doris-fe:9010
      - BE_ADDR=doris-be3:9050
    volumes:
      - doris_be3_storage:/opt/apache-doris/be/storage
      - doris_be3_log:/opt/apache-doris/be/log

networks:
  bigdata:
    external: true

volumes:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  doris_fe_meta:
  doris_fe_log:
  doris_be1_storage:
  doris_be1_log:
  doris_be2_storage:
  doris_be2_log:
  doris_be3_storage:
  doris_be3_log:
